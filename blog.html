<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — NexaMind Labs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0D1B3E;--navy:#1B2860;--indigo:#4F46E5;--indigo-light:#818CF8;--teal:#06B6D4;--amber:#F59E0B;--surface:#F5F7FF;--text:#0F172A;--muted:#64748B;--border:#E2E8F0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);background:#fff}
/* NAV */
nav{background:var(--dark);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:700;color:#fff;text-decoration:none;display:flex;align-items:center;gap:0.6rem}
.nav-labs{color:var(--indigo-light);font-weight:400;font-size:1.05rem}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.875rem;font-weight:500}
.nav-links a:hover{color:#fff}
/* HERO */
.blog-hero{background:var(--dark);padding:4rem 2rem 3rem;text-align:center}
.blog-hero h1{font-family:'Outfit',sans-serif;font-size:clamp(2rem,4vw,3rem);font-weight:800;color:#fff;margin-bottom:0.75rem;letter-spacing:-0.03em}
.blog-hero p{color:rgba(255,255,255,0.55);font-size:1rem;max-width:480px;margin:0 auto 2rem}
/* FILTER */
.filter-bar{background:#fff;border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center}
.filter-btn{padding:0.45rem 1.1rem;border-radius:100px;font-size:0.8rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted);transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
/* GRID */
.blog-section{padding:3.5rem 2rem;background:var(--surface)}
.container{max-width:1200px;margin:0 auto}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.75rem}
.blog-card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--border);transition:all 0.3s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.blog-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,0.08)}
.blog-thumb{height:190px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;flex-shrink:0;overflow:hidden}
.blog-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s}
.blog-card:hover .blog-thumb img{transform:scale(1.05)}
.blog-body{padding:1.5rem;flex:1;display:flex;flex-direction:column}
.blog-meta{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
.blog-tag{font-size:0.7rem;font-weight:700;color:var(--indigo);background:rgba(79,70,229,0.09);padding:0.22rem 0.75rem;border-radius:100px}
.blog-date{font-size:0.72rem;color:var(--muted)}
.blog-card h2{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.05rem;color:var(--dark);margin-bottom:0.5rem;line-height:1.4}
.blog-card p{font-size:0.85rem;color:var(--muted);line-height:1.65;flex:1}
.blog-author{display:flex;align-items:center;gap:0.5rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.author-dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--teal));display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#fff}
.author-name{font-size:0.78rem;font-weight:600;color:var(--text)}
.read-more{font-size:0.78rem;color:var(--indigo);font-weight:700;margin-left:auto}
/* EMPTY */
.empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty h3{font-family:'Outfit',sans-serif;font-size:1.2rem;color:var(--dark);margin-bottom:0.5rem}
/* FOOTER */
footer{background:var(--dark);padding:2rem;text-align:center}
footer p{font-size:0.8rem;color:rgba(255,255,255,0.3)}
footer a{color:var(--indigo-light);text-decoration:none;margin-left:1rem}
/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--muted);font-size:0.9rem}
@media(max-width:600px){.blog-grid{grid-template-columns:1fr}.filter-bar{padding:0.75rem 1rem}.blog-section{padding:2.5rem 1.25rem}}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 120 120" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="22" fill="#1B2860"/>
      <rect x="16" y="16" width="18" height="88" rx="5" fill="white"/>
      <rect x="86" y="16" width="18" height="88" rx="5" fill="white"/>
      <line x1="34" y1="16" x2="86" y2="104" stroke="white" stroke-width="18" stroke-linecap="butt"/>
      <polygon points="76,60 68,46 52,46 44,60 52,74 68,74" fill="#4F46E5"/>
      <polygon points="60,49 62.83,57.17 71,60 62.83,62.83 60,71 57.17,62.83 49,60 57.17,57.17" fill="#06B6D4"/>
      <circle cx="60" cy="60" r="3.5" fill="white"/>
    </svg>
    NexaMind <span class="nav-labs">Labs</span>
  </a>
  <ul class="nav-links">
    <li><a href="/#services">Services</a></li>
    <li><a href="/#training">Training</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>

<div class="blog-hero">
  <h1>From the blog</h1>
  <p>Insights on AI, software development, and education from the NexaMind Labs team.</p>
<p style="font-family:'Outfit',sans-serif;font-size:0.82rem;font-weight:600;color:rgba(129,140,248,0.9);letter-spacing:0.04em;margin-top:0.5rem">From Spark to Scale</p>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">All posts</button>
  <button class="filter-btn" data-filter="AI">AI</button>
  <button class="filter-btn" data-filter="Dev">Dev</button>
  <button class="filter-btn" data-filter="Education">Education</button>
  <button class="filter-btn" data-filter="SaaS">SaaS</button>
</div>

<section class="blog-section">
  <div class="container">
    <div class="blog-grid" id="blog-grid">
      <div class="loading">Loading posts…</div>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 NexaMind Labs <a href="/">Back to home</a></p>
</footer>

<script src="https://unpkg.com/marked@9.1.6/marked.min.js"></script>
<script>
const REPO = 'jyothishnarayan/nexamindlabs-website';
const BRANCH = 'main';
const THUMBS = {
  AI: {bg:'linear-gradient(135deg,#EEF2FF,#C7D2FE)', icon:'🤖'},
  Dev: {bg:'linear-gradient(135deg,#F0FDFA,#99F6E4)', icon:'🚀'},
  Education: {bg:'linear-gradient(135deg,#FFFBEB,#FDE68A)', icon:'📚'},
  SaaS: {bg:'linear-gradient(135deg,#F0FDF4,#BBF7D0)', icon:'⚡'},
  General: {bg:'linear-gradient(135deg,#F8FAFC,#E2E8F0)', icon:'💡'}
};

let allPosts = [];
let activeFilter = 'all';

function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---/);
  if (!match) return { meta: {}, body: text };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const [key, ...rest] = line.split(':');
    if (key && rest.length) meta[key.trim()] = rest.join(':').trim().replace(/^["']|["']$/g,'');
  });
  return { meta, body: text.slice(match[0].length).trim() };
}

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
}

function initials(name) {
  return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
}

function renderCards(posts) {
  const grid = document.getElementById('blog-grid');
  const filtered = activeFilter === 'all' ? posts : posts.filter(p => p.meta.category === activeFilter);
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><h3>No posts yet</h3><p>Check back soon.</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(post => {
    const t = THUMBS[post.meta.category] || THUMBS.General;
    const slug = post.filename.replace(/\.md$/,'');
    const thumb = post.meta.image
      ? `<div class="blog-thumb" style="background:${t.bg};overflow:hidden;padding:0"><img src="${post.meta.image}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'"></div>`
      : `<div class="blog-thumb" style="background:${t.bg}">${t.icon}</div>`;
    return `
      <a class="blog-card" href="/post.html?slug=${slug}">
        ${thumb}
        <div class="blog-body">
          <div class="blog-meta">
            <span class="blog-tag">${post.meta.category || 'General'}</span>
            <span class="blog-date">${formatDate(post.meta.date)}</span>
          </div>
          <h2>${post.meta.title}</h2>
          <p>${post.meta.summary || ''}</p>
          <div class="blog-author">
            <div class="author-dot">${initials(post.meta.author || 'NL')}</div>
            <span class="author-name">${post.meta.author || 'NexaMind Labs'}</span>
            <span class="read-more">Read →</span>
          </div>
        </div>
      </a>`;
  }).join('');
}

async function loadPosts() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/posts?ref=${BRANCH}`);
    if (!res.ok) throw new Error('No posts folder');
    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md'));
    const posts = await Promise.all(mdFiles.map(async f => {
      const r = await fetch(f.download_url);
      const text = await r.text();
      const { meta } = parseFrontmatter(text);
      return { meta, filename: f.name };
    }));
    allPosts = posts.sort((a,b) => new Date(b.meta.date) - new Date(a.meta.date));
    renderCards(allPosts);
  } catch(e) {
    document.getElementById('blog-grid').innerHTML =
      '<div class="empty"><h3>No posts yet</h3><p>Posts will appear here once published.</p></div>';
  }
}

document.getElementById('filter-bar').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  renderCards(allPosts);
});

loadPosts();
</script>
</body>
</html>
