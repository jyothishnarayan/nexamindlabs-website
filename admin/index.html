<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <title>NexaMind Labs — CMS</title>
</head>
<body>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token    = params.get('nml_token');
  var provider = params.get('nml_provider');

  // ── POPUP CALLBACK MODE ──────────────────────────────────────
  if (token && provider) {
    // Clean token from URL immediately
    history.replaceState({}, '', '/admin/');

    // Pass token to the main CMS tab via BroadcastChannel
    try {
      var bc = new BroadcastChannel('nml-cms-auth');
      bc.postMessage({ token: token, provider: provider });
      bc.close();
    } catch(e) {
      // Fallback: localStorage polling
      localStorage.setItem('nml-cms-pending', JSON.stringify({
        token: token,
        provider: provider,
        ts: Date.now()
      }));
    }

    // Close popup — DON'T load CMS
    document.body.innerHTML =
      '<p style="font-family:sans-serif;text-align:center;padding:3rem;color:#4F46E5">' +
      '&#x2713; Authorized! Closing&hellip;</p>';

    setTimeout(function() { window.close(); }, 800);
    return; // Stop here — no CMS load
  }

  // ── MAIN CMS TAB MODE ────────────────────────────────────────
  // Listen for token from popup via BroadcastChannel
  try {
    var bc = new BroadcastChannel('nml-cms-auth');
    bc.onmessage = function(e) {
      bc.close();
      deliverToken(e.data.token, e.data.provider);
    };
  } catch(e) {}

  // localStorage fallback (for browsers without BroadcastChannel)
  var poll = setInterval(function() {
    var raw = localStorage.getItem('nml-cms-pending');
    if (!raw) return;
    clearInterval(poll);
    localStorage.removeItem('nml-cms-pending');
    try {
      var d = JSON.parse(raw);
      // Only use if fresh (< 2 min old)
      if (Date.now() - d.ts < 120000) {
        deliverToken(d.token, d.provider);
      }
    } catch(e) {}
  }, 300);
  setTimeout(function() { clearInterval(poll); }, 300000);

  function deliverToken(t, p) {
    window.dispatchEvent(new MessageEvent('message', {
      data: 'authorization:' + p + ':success:' + JSON.stringify({ token: t, provider: p }),
      origin: window.location.origin,
      source: window
    }));
  }

  // Load Decap CMS only in main tab
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
  document.body.appendChild(s);

})();
</script>
</body>
</html>
